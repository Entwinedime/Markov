name: markov-next

x-build-proxy: &build-proxy
  http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
  https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
  HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
  HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}

x-profile-common: &profile-common
  working_dir: /workspace/trace-sim
  network_mode: host
  ipc: host
  privileged: true
  volumes:
    - ../..:/workspace/trace-sim
    - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
    - /usr/local/Ascend/add-ons:/usr/local/Ascend/add-ons:ro
    - /usr/local/dcmi:/usr/local/dcmi:ro
    - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
    - /usr/local/sbin:/usr/local/sbin:ro
    - /models:/models:ro
    - /root/models:/root/models
    - /dev:/dev

x-common-env: &common-env
  ASCEND_VISIBLE_DEVICES: ${ASCEND_VISIBLE_DEVICES:-0}

services:
  sglang-profile:
    <<: *profile-common
    build:
      context: ../..
      dockerfile: docker/images/sglang/Dockerfile
      network: ${MARKOV_BUILD_NETWORK:-default}
      args:
        <<: *build-proxy
        BASE_IMAGE: ${MARKOV_IMAGE_PREFIX:-markov-next}-sglang-env:ubuntu22.04
    image: ${MARKOV_IMAGE_PREFIX:-markov-next}-sglang:ubuntu22.04
    pull_policy: never
    environment:
      <<: *common-env
      ASCEND_CUSTOM_OPP_PATH: /usr/local/Ascend/ascend-toolkit/latest/opp/vendors/batch_invariant
    command: bash

  ktransformers-profile:
    <<: *profile-common
    build:
      context: ../..
      dockerfile: docker/images/ktransformers/Dockerfile
      network: ${MARKOV_BUILD_NETWORK:-default}
      args:
        <<: *build-proxy
        BASE_IMAGE: ${MARKOV_IMAGE_PREFIX:-markov-next}-ktransformers-env:ubuntu22.04
    image: ${MARKOV_IMAGE_PREFIX:-markov-next}-ktransformers:ubuntu22.04
    pull_policy: never
    environment:
      <<: *common-env
    command: bash

  modeling:
    working_dir: /workspace/trace-sim
    build:
      context: ../..
      dockerfile: docker/images/modeling/Dockerfile
      network: ${MARKOV_BUILD_NETWORK:-default}
      args:
        <<: *build-proxy
    image: ${MARKOV_IMAGE_PREFIX:-markov-next}-modeling:ubuntu24.04
    pull_policy: never
    volumes:
      - ../..:/workspace/trace-sim
    command: bash
