[project]
name = "ktransformers-sglang-trace-sim"
version = "0.1.0"
description = "Trace-driven profiling, DAG modeling, and what-if simulation for ktransformers and sglang."
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "build",
    "data",
    "docs/tmp",
    "third_party",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
