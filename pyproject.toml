[project]
name = "ktransformers-sglang-trace-sim"
version = "0.1.0"
description = "Trace-driven profiling, DAG modeling, and what-if simulation for ktransformers and sglang."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[project.entry-points."sglang.srt.plugins"]
markov_input_facts = "markov.adapters.sglang.input_facts:install"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "build",
    "data",
    "deprecated",
    "docs/tmp",
    "third_party",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
