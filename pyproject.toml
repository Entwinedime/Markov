[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "markov-collection"
version = "0.0.0"
requires-python = ">=3.10"
description = "Native inference observations for Markov"

[project.entry-points."sglang.srt.plugins"]
markov = "markov_collection.adapters.frameworks.sglang.hooks:install"

[tool.setuptools.packages.find]
where = ["src/collection", "src/workload"]
include = ["markov_collection*", "markov_workload*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
